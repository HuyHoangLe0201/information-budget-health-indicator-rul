[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infobudget"
version = "1.0.0"
description = "Information lower bound of health indicators for remaining useful life prediction (reference implementation of Le and Nguyen)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Huy Hoang Le" }, { name = "Kim-Anh Nguyen" }]
keywords = ["prognostics", "remaining useful life", "health indicator", "information theory", "reliability"]
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.3", "pandas>=2.1"]

[project.optional-dependencies]
models = ["torch>=2.2"]
reproduce = ["torch>=2.2", "matplotlib>=3.8", "openpyxl>=3.1", "Pillow"]
test = ["pytest>=8"]

[project.scripts]
infobudget = "infobudget.__main__:main"

[tool.setuptools.packages.find]
include = ["infobudget*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
